<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page" id="page1">

        <h1>JavaScript Quiz</h1>

        <h2>Student Details</h2>

        <label>Name:</label>
        <input type="text" id="name">

        <label>Roll Number:</label>
        <input type="text" id="roll">

        <label>Email:</label>
        <input type="email" id="email">

        <label>Course:</label>
        <input type="text" id="course">

        <button onclick="startQuiz()">Start Quiz</button>
    </div>
    <div class="page quiz-page" id="quizPage">

        <div class="quiz-header">

            <span>
                Question <span id="questionNumber">1</span> of 5
            </span>

            <span>
                Total Time: <span id="totalTimer">02:30</span>
            </span>

        </div>

        <div class="question-time">
            Time Left: <span id="questionTimer">30</span> seconds
        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button id="nextButton" onclick="nextQuestion()">
            Next
        </button>

    </div>

    <div class="page" id="resultPage">

        <h1>Quiz Completed</h1>

        <p>
            Name:
            <span id="resultName"></span>
        </p>

        <p>
            Roll Number:
            <span id="resultRoll"></span>
        </p>

        <h2>
            Your Score:
            <span id="score"></span> / 5
        </h2>

    </div>

    <script src="script.js"></script>

</body>

</html>
